<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Thato Ntlati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://kit.fontawesome.com/c676e092c5.js" crossorigin="anonymous"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .thank-you-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: popup 0.5s ease-out forwards;
            position: relative;
            z-index: 1;
        }

        .thank-you-card i {
            font-size: 56px;
            color: #00ddff;
            margin-bottom: 20px;
        }

        .thank-you-card h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .thank-you-card p {
            color: #8b8b9a;
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        @keyframes popup {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow--cyan" aria-hidden="true"></div>

    <div class="thank-you-card">
        <i class="fa-solid fa-circle-check"></i>
        <h1>Message Sent!</h1>
        <p>Thanks for reaching out. I've received your message and will get back to you within 24 hours.</p>
        <a href="index.html" class="btn btn-primary">Back to Home</a>
    </div>
</body>
</html>
